[project]
name = "document-ocr"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=2.4.6",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "rapidocr>=3.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]
