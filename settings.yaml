# この PC 共通の設定（どの様式でも使う。GUI の「共通設定」でも編集できます）

# Tesseract の実行ファイル。null なら PATH / 標準インストール先から自動検出
tesseract_cmd: null

# Tesseract で文字（日本語）項目を読むときの言語。jpn の言語データが必要
tesseract_lang: jpn+eng

# indra-ocr のモデルフォルダ。null なら初回に Hugging Face からダウンロードしてキャッシュ
# （2 回目以降は通信しない）。ネットワークの無い PC ではモデルを置いたフォルダを指定する
indra_model_dir: null
